              - paragraph [ref=e80]:
                - generic [ref=e81]: Better
                - text: A list of solutions is on the board.
              - paragraph [ref=e82]: The verb 'is' agrees with the singular subject 'list', not the plural 'solutions'.
            - article [ref=e83]:
