name: Auto-post Telegram content

on:
  schedule:
    - cron: "0 13 * * 1,3,5"
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional forced topic"
        required: false
        default: ""
      dry_run:
        description: "Run without posting"
        required: false
        default: "false"

jobs:
  telegram-post:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate required secrets
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] || [ -z "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            echo "Missing TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID secret."
            exit 1
          fi

      - name: Generate and publish Telegram post
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_URL: ${{ secrets.TELEGRAM_CHANNEL_URL }}
          TELEGRAM_POST_TEMPLATE: ${{ secrets.TELEGRAM_POST_TEMPLATE }}
        run: |
          TOPIC="${{ github.event.inputs.topic || '' }}"
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"

          CMD="node scripts/post-telegram-content.mjs"

          if [ -n "$TOPIC" ]; then
            CMD="$CMD --topic \"$TOPIC\""
          fi

          if [ "$DRY_RUN" = "true" ]; then
            CMD="$CMD --dry-run"
          fi

          eval "$CMD"
