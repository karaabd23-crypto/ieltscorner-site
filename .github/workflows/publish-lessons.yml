name: Publish Weekly lessons

on:
  schedule:
    - cron: "30 14 * * 2"   # Tuesday 2:30 PM UTC
    - cron: "30 14 * * 5"   # Friday 2:30 PM UTC
  workflow_dispatch:
    inputs:
      per_category_count:
        description: "How many lessons to generate per category"
        required: false
        default: "1"
      categories:
        description: "Comma-separated categories (grammar,vocabulary)"
        required: false
        default: "grammar,vocabulary"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate lessons
        env:
          LESSON_GENERATOR_MODE: fallback
        run: |
          COUNT="${{ github.event.inputs.per_category_count || '1' }}"
          CATEGORIES_INPUT="${{ github.event.inputs.categories || 'grammar,vocabulary' }}"
          echo "Lesson generation mode: fallback"

          IFS=',' read -ra CATEGORIES <<< "$CATEGORIES_INPUT"
          for CATEGORY in "${CATEGORIES[@]}"; do
            CATEGORY="$(echo "$CATEGORY" | xargs)"
            if [ -z "$CATEGORY" ]; then
              continue
            fi
            echo "Generating $COUNT lesson(s) for category: $CATEGORY"
            node scripts/generate-lessons.mjs --count "$COUNT" --category "$CATEGORY"
          done

      - name: Run lesson quality gate for generated files
        run: npm run lesson:check:standards:working

      - name: Commit and push generated lessons
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git config user.name "ieltscorner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/content/lessons/*.md
          git commit -m "chore: publish generated lesson"
          git push
