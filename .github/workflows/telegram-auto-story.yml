name: Auto-post Telegram stories

on:
  schedule:
    # Post stories 3 times per day: 10am, 2pm, 7pm UTC
    - cron: "0 10,14,19 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without posting"
        required: false
        default: "false"

jobs:
  telegram-story:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN || secrets.BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHANNEL_ID || secrets.CHAT_ID }}
      TELEGRAM_CHANNEL_URL: ${{ secrets.TELEGRAM_CHANNEL_URL || secrets.CHANNEL_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate required secrets
        if: ${{ github.event.inputs.dry_run != 'true' }}
        id: validate_secrets
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || { [ -z "$TELEGRAM_CHAT_ID" ] && [ -z "$TELEGRAM_CHANNEL_URL" ]; }; then
            echo "⚠️ Missing Telegram posting secrets. Skipping this run instead of failing."
            echo "Set one of: TELEGRAM_BOT_TOKEN / TELEGRAM_TOKEN / BOT_TOKEN"
            echo "And one target: TELEGRAM_CHAT_ID / TELEGRAM_CHANNEL_ID / CHAT_ID or TELEGRAM_CHANNEL_URL / CHANNEL_URL"
            echo "skip_post=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip_post=false" >> "$GITHUB_OUTPUT"

      - name: Generate and publish Telegram story
        if: ${{ github.event.inputs.dry_run == 'true' || steps.validate_secrets.outputs.skip_post != 'true' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
        run: |
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"

          CMD="node scripts/post-telegram-story.mjs"

          if [ "$DRY_RUN" = "true" ]; then
            CMD="$CMD --dry-run"
          fi

          eval "$CMD"
