name: Auto-post Telegram stories

on:
  schedule:
    # Post stories 3 times per day: 10am, 2pm, 7pm UTC
    - cron: "0 10,14,19 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run without posting"
        required: false
        default: "false"

jobs:
  telegram-story:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate required secrets
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [ -z "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] || [ -z "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            echo "Missing TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID secret."
            exit 1
          fi

      - name: Generate and publish Telegram story
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DRY_RUN="${{ github.event.inputs.dry_run || 'false' }}"

          CMD="node scripts/post-telegram-story.mjs"

          if [ "$DRY_RUN" = "true" ]; then
            CMD="$CMD --dry-run"
          fi

          eval "$CMD"
