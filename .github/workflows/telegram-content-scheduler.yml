name: Telegram Content Scheduler

on:
  schedule:
    # Run 5 times daily: 9am, 12pm, 3pm, 6pm, 9pm UTC
    - cron: '0 9,12,15,18,21 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  post-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore Telegram history cache
        id: restore-telegram-history
        uses: actions/cache/restore@v4
        with:
          path: .cache/telegram-post-history.json
          key: telegram-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            telegram-history-${{ github.ref_name }}-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Post Telegram content
        env:
          # API keys are OPTIONAL - script will use fallback content if not provided
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Required for posting to Telegram
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_CHANNEL_URL: ${{ secrets.TELEGRAM_CHANNEL_URL }}
          TELEGRAM_HISTORY_FILE: .cache/telegram-post-history.json
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: node scripts/post-telegram-content.mjs

      - name: Save Telegram history cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/telegram-post-history.json
          key: telegram-history-${{ github.ref_name }}-${{ github.run_id }}

      - name: Log completion
        if: always()
        run: echo "Telegram content post completed at $(date)"
