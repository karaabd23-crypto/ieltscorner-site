name: Telegram Story Scheduler

on:
  schedule:
    # Run 3 times daily at North America-friendly windows (UTC):
    # 17:00, 23:00, 02:00
    # ≈ ET: 12pm, 6pm, 9pm | PT: 9am, 3pm, 6pm
    - cron: '0 2,17,23 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  post-story:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore Telegram history cache
        id: restore-telegram-history
        uses: actions/cache/restore@v4
        with:
          path: .cache/telegram-post-history.json
          key: telegram-history-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            telegram-history-${{ github.ref_name }}-

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Post Telegram story
        env:
          # API keys are OPTIONAL - script will use fallback content if not provided
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Required for all Telegram publishing
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Optional fallback to legacy channel-post mode
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_CHANNEL_URL: ${{ secrets.TELEGRAM_CHANNEL_URL }}
          # Optional true Telegram Business Story mode
          TELEGRAM_BUSINESS_CONNECTION_ID: ${{ secrets.TELEGRAM_BUSINESS_CONNECTION_ID }}
          TELEGRAM_STORY_PHOTO_URL: ${{ secrets.TELEGRAM_STORY_PHOTO_URL }}
          TELEGRAM_STORY_VIDEO_URL: ${{ secrets.TELEGRAM_STORY_VIDEO_URL }}
          TELEGRAM_STORY_ACTIVE_PERIOD: ${{ vars.TELEGRAM_STORY_ACTIVE_PERIOD }}
          TELEGRAM_STORY_POST_TO_CHAT_PAGE: ${{ vars.TELEGRAM_STORY_POST_TO_CHAT_PAGE }}
          TELEGRAM_STORY_PROTECT_CONTENT: ${{ vars.TELEGRAM_STORY_PROTECT_CONTENT }}
          TELEGRAM_STORY_FALLBACK_TO_POST: 'true'
          TELEGRAM_HISTORY_FILE: .cache/telegram-post-history.json
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: node scripts/post-telegram-story.mjs

      - name: Save Telegram history cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/telegram-post-history.json
          key: telegram-history-${{ github.ref_name }}-${{ github.run_id }}

      - name: Log completion
        if: always()
        run: echo "Telegram story post completed at $(date)"
