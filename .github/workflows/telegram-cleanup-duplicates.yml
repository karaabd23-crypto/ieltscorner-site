name: Telegram Cleanup Duplicates

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Delete duplicates (true) or dry-run only (false)'
        required: true
        default: 'false'

jobs:
  cleanup-duplicates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run cleanup (dry-run)
        if: inputs.apply != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_CHANNEL_URL: ${{ secrets.TELEGRAM_CHANNEL_URL }}
        run: node scripts/cleanup-telegram-duplicates.mjs

      - name: Run cleanup (apply)
        if: inputs.apply == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_CHANNEL_URL: ${{ secrets.TELEGRAM_CHANNEL_URL }}
        run: node scripts/cleanup-telegram-duplicates.mjs --apply
