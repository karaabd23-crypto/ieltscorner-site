[build]
  command = "npm ci --no-audit --no-fund && npm run build"
  publish = "dist"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src public astro.config.mjs package.json package-lock.json tsconfig.json"

[build.environment]
  NODE_VERSION = "20"
