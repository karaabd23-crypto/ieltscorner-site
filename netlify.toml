[build]
  command = "npm ci --no-audit --no-fund && npm run build"
  publish = "dist"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src public netlify astro.config.mjs package.json package-lock.json tsconfig.json"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/blog/celpip-speaking-task-2-opinion-strategy"
  to = "/blog/celpip-speaking-task-7-opinion-strategy"
  status = 301
  force = true

