[build]
  command = "npm ci --no-audit --no-fund && npm run build"
  publish = "dist"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src public netlify scripts astro.config.mjs package.json package-lock.json tsconfig.json"

[build.environment]
  NODE_VERSION = "22"
  SECRETS_SCAN_OMIT_KEYS = "KIT_FORM_ID,KIT_DEFAULT_TAG_ID"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Domain aliases — redirect celpipcorner.com/celpipcorner.ca to ieltscorner.ca
# These domains must be added in Netlify dashboard + DNS pointed to Netlify
[[redirects]]
  from = "https://celpipcorner.com/*"
  to = "https://ieltscorner.ca/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.celpipcorner.com/*"
  to = "https://ieltscorner.ca/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://celpipcorner.ca/*"
  to = "https://ieltscorner.ca/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.celpipcorner.ca/*"
  to = "https://ieltscorner.ca/:splat"
  status = 301
  force = true

# Canonical host — force http:// and www. to https://ieltscorner.ca (no www).
# GSC has been crawling/ranking http://ieltscorner.ca/ ahead of the canonical
# https:// URL for 6+ weeks (SEO report 2026-40); every page already declares
# rel=canonical to https://ieltscorner.ca, but there was no redirect enforcing it.
[[redirects]]
  from = "http://ieltscorner.ca/*"
  to = "https://ieltscorner.ca/:splat"
  status = 301
