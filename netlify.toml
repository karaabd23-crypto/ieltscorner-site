[build]
  command = "npm ci --no-audit --no-fund && npm run build"
  publish = "dist"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src public netlify astro.config.mjs package.json package-lock.json tsconfig.json"

[build.environment]
  NODE_VERSION = "20"

# Scheduled function: Post telegram content 5x daily (9am, 12pm, 3pm, 6pm, 9pm UTC)
[[scheduled_functions]]
path = "/scheduled-post-telegram"
cron = "0 9,12,15,18,21 * * *"

# Scheduled function: Post telegram stories 3x daily (10am, 2pm, 7pm UTC)
[[scheduled_functions]]
path = "/scheduled-story-telegram"
cron = "0 10,14,19 * * *"

